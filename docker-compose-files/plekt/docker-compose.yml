
version: "3.8"

services:
  plekt:
    image: ghcr.io/lasikiewicz/plekt:latest

    environment:
      - TZ=${TZ:-Europe/Madrid}
      - PLEKT_PUBLISHED_PORT=5056
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=${PLEKT_ADMIN_PASSWORD}

    ports:
      - "5056:5055"

    volumes:
      - ${DOCKER_PATH_PERSISTENT}/plekt:/data

    networks:
      - infra_net

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

networks:
  infra_net:
    external: true
